name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Cross-Platform Binaries
        run: |
          mkdir -p dist
          # Darwin (macOS)
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/sunray-darwin-arm64 .
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/sunray-darwin-amd64 .
          # Linux
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/sunray-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/sunray-linux-arm64 .
          # Windows
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/sunray-windows-amd64.exe .

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
